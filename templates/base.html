<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}计量器具管理系统{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root { --primary: #1a73e8; --sidebar-bg: #ffffff; --body-bg: #f5f7fa; }
        body { background: var(--body-bg); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .navbar { background: #1a73e8 !important; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .navbar-brand { font-weight: 700; letter-spacing: 0.5px; }
        .card { border: none; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
        .table th { font-weight: 600; color: #555; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px; border-top: none; }
        .badge-status { padding: 5px 12px; border-radius: 20px; font-weight: 500; font-size: 0.8rem; }
        .status-在用 { background: #e6f4ea; color: #1e8e3e; }
        .status-校准中 { background: #fef7e0; color: #f9ab00; }
        .status-报废 { background: #fce8e6; color: #d93025; }
        .alert-badge { animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
        .stat-card { border-left: 4px solid var(--primary); }
        .stat-card.warning { border-left-color: #f9ab00; }
        .stat-card.danger { border-left-color: #d93025; }
        .btn-primary { background: #1a73e8; border: none; border-radius: 8px; padding: 8px 20px; }
        .btn-primary:hover { background: #1557b0; }
        @media (max-width: 768px) {
            .container-fluid { padding: 10px; }
            .table-responsive { font-size: 0.85rem; }
        }
    </style>
</head>
<body>
    {% if session.user_id %}
    <nav class="navbar navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/"><i class="bi bi-gear-fill me-2"></i>计量器具管理系统</a>
            <div class="d-flex align-items-center">
                <span class="text-white me-3"><i class="bi bi-person-circle me-1"></i>{{ session.username }}</span>
                <a href="/logout" class="btn btn-outline-light btn-sm">退出</a>
            </div>
        </div>
    </nav>
    {% endif %}
    <div class="container-fluid py-3">
        {% with messages = get_flashed_messages() %}
        {% if messages %}
        {% for msg in messages %}
        <div class="alert alert-info alert-dismissible fade show" role="alert">
            {{ msg }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        {% endfor %}
        {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
